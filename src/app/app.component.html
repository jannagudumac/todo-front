<mat-sidenav-container>
    <mat-sidenav #sidenav [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile && authService.isLoggedIn()">
        @if(authService.isLoggedIn()) {
            <div class="sidenav-brand">
                <mat-icon class="sidenav-brand-icon">rocket_launch</mat-icon>
                <span class="sidenav-brand-name">PlanIt</span>
            </div>
            <mat-nav-list>
                <a mat-list-item routerLink="" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact:true}">
                    <mat-icon matListItemIcon>dashboard</mat-icon>
                    <span matListItemTitle>Tableau de bord</span>
                </a>
                <a mat-list-item routerLink="/projets" routerLinkActive="active-link">
                    <mat-icon matListItemIcon>folder_open</mat-icon>
                    <span matListItemTitle>Projets</span>
                </a>
                <a mat-list-item routerLink="/todo-list" routerLinkActive="active-link">
                    <mat-icon matListItemIcon>task</mat-icon>
                    <span matListItemTitle>Mes Tâches</span>
                </a>
                <a mat-list-item routerLink="/contacts" routerLinkActive="active-link">
                    <mat-icon matListItemIcon>people</mat-icon>
                    <span matListItemTitle>Membres</span>
                </a>
                @if(authService.isAdmin){
                    <a mat-list-item routerLink="/utilisateur-list" routerLinkActive="active-link">
                        <mat-icon matListItemIcon>admin_panel_settings</mat-icon>
                        <span matListItemTitle>Utilisateurs</span>
                    </a>
                }
                <mat-divider></mat-divider>
                <a mat-list-item (click)="logout()" class="logout-item">
                    <mat-icon matListItemIcon>logout</mat-icon>
                    <span matListItemTitle>Déconnexion</span>
                </a>
            </mat-nav-list>
        }
    </mat-sidenav>

    <mat-sidenav-content>
        <div class="flex flex-col h-screen">
            @if(authService.isLoggedIn()) {
            <div id="div-toolbar">
                <mat-toolbar>
                    <button mat-icon-button (click)="sidenav.toggle()">
                        <mat-icon>menu</mat-icon>
                    </button>
                    <mat-icon class="toolbar-brand-icon">task_alt</mat-icon>
                    <span class="toolbar-title">{{title}}</span>
                </mat-toolbar>
            </div>
            }
            <div id="div-router" class="flex-1 overflow-auto">
                <router-outlet />
            </div>
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
