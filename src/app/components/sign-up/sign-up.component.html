<div class="signup-page">

  <div class="signup-brand">
    <div class="brand-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
    </div>
    <div class="brand-content">
      <div class="brand-icon">
        <span class="material-icons">rocket_launch</span>
      </div>
      <h1 class="brand-name">PlanIt</h1>
      <p class="brand-tagline">Rejoignez des équipes qui<br>organisent mieux leur travail.</p>
    </div>
  </div>

  <div class="signup-form-panel">
    <div class="signup-form-box">
      <h2 class="form-title">Créer un compte</h2>
      <p class="form-subtitle">Remplissez le formulaire pour commencer.</p>

      <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()" class="form-fields">

        <div class="field-group">
          <label class="field-label">Adresse email</label>
          <div class="field-wrap">
            <span class="material-icons field-icon">mail_outline</span>
            <input class="field-input" formControlName="username" type="email" placeholder="vous@exemple.com" />
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">Mot de passe</label>
          <div class="field-wrap">
            <span class="material-icons field-icon">lock_outline</span>
            <input class="field-input" formControlName="password" type="password" placeholder="••••••••" />
          </div>
        </div>

        <button class="btn-submit" type="submit" [disabled]="signUpForm.invalid">
          Créer mon compte
          <span class="material-icons">arrow_forward</span>
        </button>

      </form>

      <p class="login-link">
        Déjà un compte ?
        <a routerLink="/login">Se connecter</a>
      </p>
    </div>
  </div>

</div>
