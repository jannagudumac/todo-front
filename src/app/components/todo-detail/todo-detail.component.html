@if(formGroup!=null) {
<div class="page page-fade">

  <div class="detail-header">
    <button class="btn-back" (click)="onCancel()">
      <span class="material-icons">arrow_back</span>
    </button>
    <div>
      <h1>Modifier la tâche</h1>
      <p>Mettez à jour les informations de la tâche.</p>
    </div>
  </div>

  <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <div class="detail-grid">

      <div class="detail-col">
        <div class="planit-card detail-card">
          <div class="detail-card-title">
            <span class="material-icons">info_outline</span> Informations
          </div>
          <div class="field-group">
            <label class="field-label">Titre</label>
            <div class="field-wrap">
              <span class="material-icons field-icon">title</span>
              <input class="field-input" formControlName="title" placeholder="Titre de la tâche">
            </div>
          </div>
          <div class="field-group">
            <label class="field-label">Description</label>
            <div class="field-wrap">
              <span class="material-icons field-icon" style="top:14px;transform:none">notes</span>
              <textarea class="field-textarea" formControlName="description" placeholder="Description optionnelle..."></textarea>
            </div>
          </div>
          <div class="field-group">
            <label class="field-label">Statut</label>
            <div class="select-wrap">
              <select class="field-input field-select" formControlName="status">
                <option value="TODO">📋 À faire</option>
                <option value="IN_PROGRESS">⏳ En cours</option>
                <option value="DONE">✅ Terminé</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="detail-col">
        <div class="planit-card detail-card">
          <div class="detail-card-title">
            <span class="material-icons">tune</span> Détails
          </div>
          <div class="field-group">
            <label class="field-label">Priorité</label>
            <div class="select-wrap">
              <select class="field-input field-select" formControlName="priority">
                @for(item of listPriority(); track item.value) {
                  <option [value]="item.value">{{ item.text }}</option>
                }
              </select>
            </div>
          </div>
          <div class="field-group">
            <label class="field-label">Projet</label>
            <div class="select-wrap">
              <select class="field-input field-select" formControlName="projetId">
                <option [ngValue]="null">— Aucun projet —</option>
                @for(item of listProjets; track item.id) {
                  <option [ngValue]="item.id">{{ item.title }}</option>
                }
              </select>
            </div>
          </div>
          <div class="field-group">
            <label class="field-label">Date d'échéance</label>
            <div class="field-wrap">
              <span class="material-icons field-icon">calendar_today</span>
              <input class="field-input" type="date" formControlName="dueDate">
            </div>
          </div>
          <div class="field-group">
            <label class="field-label">Membres</label>
            <mat-form-field appearance="outline" class="w-full">
              <mat-chip-grid #chipGrid>
                @for(fruit of selectedFruits; track $index) {
                  <mat-chip-row (removed)="remove(fruit.id)">
                    {{ fruit.name }}
                    <button matChipRemove><mat-icon>cancel</mat-icon></button>
                  </mat-chip-row>
                }
              </mat-chip-grid>
              <input placeholder="Ajouter un membre..."
                #fruitInput [formControl]="currentFruit"
                [matChipInputFor]="chipGrid"
                [matAutocomplete]="auto"
                (input)="onCurrentFruitChange(fruitInput.value)" />
              <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selected($event)">
                @for(fruit of filteredFruits; track fruit) {
                  <mat-option [value]="fruit.id">{{ fruit.name }}</mat-option>
                }
              </mat-autocomplete>
            </mat-form-field>
          </div>
        </div>
      </div>

    </div>

    <div class="detail-actions">
      <button class="btn-primary" type="submit">
        <span class="material-icons" style="font-size:18px">save</span>
        Enregistrer
      </button>
      <button class="btn-ghost" type="button" (click)="onCancel()">Annuler</button>
    </div>
  </form>

</div>
}
