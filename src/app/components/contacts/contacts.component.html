<div class="p-4 md:p-6">

  <h1 class="text-xl font-bold mb-5" style="color:#4f46e5">Membres de l'équipe</h1>

  <!-- Add form -->
  <mat-card class="mb-5 p-4">
    <form [formGroup]="addForm" (ngSubmit)="add()" class="flex gap-3 items-center">
      <mat-form-field appearance="outline" class="flex-1">
        <mat-label>Nom du membre</mat-label>
        <input matInput formControlName="name" placeholder="Ex: Alice Dupont">
        <mat-icon matSuffix>person_add</mat-icon>
      </mat-form-field>
      <button mat-flat-button type="submit" [disabled]="addForm.invalid">
        <mat-icon>add</mat-icon> Ajouter
      </button>
    </form>
  </mat-card>

  <!-- Table -->
  <mat-card class="overflow-x-auto">
    <table mat-table [dataSource]="contacts" class="w-full">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let c">{{ c.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nom</th>
        <td mat-cell *matCellDef="let c">
          @if(editingId === c.id) {
            <mat-form-field appearance="outline" style="margin:0;width:200px">
              <input matInput [(ngModel)]="editName">
            </mat-form-field>
          } @else {
            <div class="flex items-center gap-2">
              <mat-icon style="color:#7c3aed;font-size:18px">person</mat-icon>
              {{ c.name }}
            </div>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let c">
          @if(editingId === c.id) {
            <button mat-icon-button (click)="saveEdit(c)" style="color:#059669">
              <mat-icon>check</mat-icon>
            </button>
            <button mat-icon-button (click)="cancelEdit()">
              <mat-icon>close</mat-icon>
            </button>
          } @else {
            <button mat-icon-button (click)="startEdit(c)" style="color:#4f46e5">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button (click)="delete(c.id)" style="color:#ef4444">
              <mat-icon>delete</mat-icon>
            </button>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    @if(contacts.length === 0) {
      <div class="flex flex-col items-center py-10 opacity-40">
        <mat-icon style="font-size:48px;width:48px;height:48px">group_off</mat-icon>
        <p class="mt-2">Aucun membre pour l'instant</p>
      </div>
    }
  </mat-card>

</div>
